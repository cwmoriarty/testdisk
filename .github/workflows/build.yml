name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS Apple Silicon (arm64)
            asset_os: macos
            asset_arch: arm64
          - os: macos-13
            name: macOS Intel (x86_64)
            asset_os: macos
            asset_arch: x86_64
          - os: ubuntu-latest
            name: Linux (x86_64)
            asset_os: linux
            asset_arch: x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
                                  libncurses-dev libncursesw5-dev uuid-dev zlib1g-dev libjpeg-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config ncurses

      - name: Configure and Build
        run: |
          ./autogen.sh
          if [ "${{ runner.os }}" = "macOS" ]; then
            NCURSES_PREFIX="$(brew --prefix ncurses 2>/dev/null || echo '')"
            if [ -n "$NCURSES_PREFIX" ]; then
              export CPPFLAGS="-I$NCURSES_PREFIX/include $CPPFLAGS"
              export LDFLAGS="-L$NCURSES_PREFIX/lib $LDFLAGS"
            fi
            ./configure --without-ewf --without-ntfs3g
          else
            ./configure --without-ewf --without-ntfs3g
          fi
          NCPU=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          make -j"$NCPU"

      - name: Verify Built Binaries
        run: |
          ./src/testdisk-ng /version
          ./src/testdisk-ng --help
          ./src/photorec-ng /version
          ./src/fidentify /version || true

      - name: Run Integration Tests
        run: |
          chmod +x tests/test_recovery_and_rollback.sh
          ./tests/test_recovery_and_rollback.sh

      - name: Package Release Archive
        run: |
          TAR_NAME="testdisk-ng-v7.2-WIP-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          mkdir -p dist/bin
          cp src/testdisk-ng dist/bin/
          cp src/photorec-ng dist/bin/
          cp src/fidentify dist/bin/
          cp AUTHORS ChangeLog NEWS README.md dist/ 2>/dev/null || true
          tar -czvf "$TAR_NAME" -C dist .
          shasum -a 256 "$TAR_NAME" > "${TAR_NAME}.sha256"
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: testdisk-ng-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256

      - name: Publish GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
